name: スマホ固定タブ修正
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-sticky-temp.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: スマホ固定タブを修正
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tabs.html')
          s=p.read_text()
          old='.page{width:100%;max-width:100%;padding:10px;overflow-x:hidden}'
          new='.page{width:100%;max-width:100%;padding:10px}'
          if old not in s:
            raise SystemExit('対象CSSが見つかりません')
          p.write_text(s.replace(old,new,1))
          PY
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.html
          git diff --cached --quiet && exit 0
          git commit -m "スマホ固定タブのスクロール挙動を修正"
          git push
