name: スマホ固定表示修正
on:
  push:
    paths:
      - '.github/workflows/fix-sticky-overflow-temp.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固定表示を妨げる指定だけ削除
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tabs.html')
          s=p.read_text()
          old='html,body{width:100%;max-width:100%;overflow-x:hidden}'
          new='html,body{width:100%;max-width:100%}'
          if old not in s:
            raise SystemExit('対象指定が見つかりません')
          p.write_text(s.replace(old,new,1))
          PY
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.html
          git diff --cached --quiet && exit 0
          git commit -m "スマホ選択中タブの固定表示を修正"
          git push
