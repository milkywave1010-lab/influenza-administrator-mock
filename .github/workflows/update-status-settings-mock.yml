name: Update status settings mock
on:
  push:
    paths:
      - '.github/workflows/update-status-settings-mock.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tabs mock only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tabs.html')
          text = path.read_text()
          marker = 'status-settings-final-layout'
          if marker in text:
              raise SystemExit('layout already applied')

          css = Path('.github/status-style.css').read_text()
          fragment = Path('.github/status-fragment.html').read_text().rstrip()
          text = text.replace('</head>', f'<style id="{marker}">\n{css}</style>\n</head>', 1)

          start = text.index('<section id="status" class="tabpage hidden">')
          end = text.index('</section>', start) + len('</section>')
          text = text[:start] + fragment + text[end:]
          path.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.html
          git diff --cached --quiet && exit 0
          git commit -m 'ステータス設定モックの見た目を更新'
          git push
