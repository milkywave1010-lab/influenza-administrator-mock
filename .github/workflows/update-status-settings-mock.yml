name: Update status settings mock
on:
  push:
    paths:
      - '.github/workflows/update-status-settings-mock.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tabs mock only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tabs.html')
          text = path.read_text()

          marker = 'status-settings-final-layout'
          if marker in text:
              raise SystemExit('layout already applied')

          css = r'''
<style id="status-settings-final-layout">
/* 本番と同じ3タブ配色 */
.tab[data-tab="manage"]{background:#2f7158!important;border-color:#2f7158!important;color:#fff!important}
.tab[data-tab="counter"]{background:#fff0dc!important;border-color:#e8c99b!important;color:#7f531f!important}
.tab[data-tab="status"]{background:#eaf4fb!important;border-color:#bdd4e3!important;color:#315f7b!important}

/* 1段目：ステータス4カード */
.status-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.status-card{min-width:0;padding:18px}
.status-card strong.state-error{color:var(--red)}

/* 2段目：処理ログ10件常駐 */
.logs{margin-top:14px}
.logs .panel-head .all-logs{border:0;background:transparent;color:var(--green);font-size:16px;font-weight:900;cursor:pointer}
.log{grid-template-columns:110px 190px minmax(0,1fr) 100px;gap:14px;padding:14px 10px;font-size:24px;align-items:center}
.log .error{color:var(--red);font-weight:900}

/* 3〜5段目：設定カード */
.settings-area{display:grid;gap:12px;margin-top:14px}
.settings-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.setting-card{overflow:hidden}
.setting-card summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;cursor:pointer}
.setting-card summary::-webkit-details-marker{display:none}
.setting-card summary h3{margin:0;font-size:20px}
.setting-card summary span{display:block;margin-top:5px;color:var(--muted);font-size:13px;font-weight:600}
.setting-card summary .chev{font-size:24px;line-height:1;transition:transform .15s ease}
.setting-card[open] summary .chev{transform:rotate(180deg)}
.setting-body{padding:16px 20px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}

@media(max-width:900px){
  .status-grid{grid-template-columns:1fr}
  .log{grid-template-columns:90px 1fr 84px;font-size:18px;gap:8px}
  .log span:nth-child(3){grid-column:1/-1}
  .log span:last-child{display:block}
  .settings-row{grid-template-columns:1fr}
}
</style>
'''
          text = text.replace('</head>', css + '\n</head>', 1)

          status = r'''<section id="status" class="tabpage hidden">
  <div class="status-grid">
    <div class="card status-card">
      <h3>GAS通信</h3>
      <strong>正常</strong>
      <div class="rows">
        <div class="row"><span>最終確認</span><b>19:40</b></div>
        <div class="row"><span>エラー</span><b>0件</b></div>
      </div>
    </div>
    <div class="card status-card">
      <h3>スプレッドシート</h3>
      <strong>接続済み</strong>
      <div class="rows">
        <div class="row"><span>予約シート</span><b>正常</b></div>
        <div class="row"><span>同期</span><b>正常</b></div>
      </div>
    </div>
    <div class="card status-card">
      <h3>Googleカレンダー</h3>
      <strong>接続済み</strong>
      <div class="rows">
        <div class="row"><span>最終接続</span><b>19:40</b></div>
      </div>
    </div>
    <div class="card status-card">
      <h3>エラーステータス</h3>
      <strong>異常なし</strong>
      <div class="rows">
        <div class="row"><span>最終確認</span><b>19:40</b></div>
      </div>
    </div>
  </div>

  <div class="card logs">
    <div class="panel-head"><h2>処理ログ</h2><button type="button" class="all-logs">すべて見る ›</button></div>
    <div class="panel-body">
      <div class="log"><b>19:38</b><span>予約更新</span><span>予約一覧を更新しました</span><span class="ok">正常</span></div>
      <div class="log"><b>19:31</b><span>キャンセル</span><span>R-20260907-1100-01</span><span class="ok">正常</span></div>
      <div class="log"><b>19:20</b><span>管理画面</span><span>予約状況を取得しました</span><span class="ok">正常</span></div>
      <div class="log"><b>18:52</b><span>新規予約</span><span>新規予約を登録しました</span><span class="ok">正常</span></div>
      <div class="log"><b>18:47</b><span>Googleカレンダー</span><span>予定を作成しました</span><span class="ok">正常</span></div>
      <div class="log"><b>18:33</b><span>スプレッドシート</span><span>予約シートと同期しました</span><span class="ok">正常</span></div>
      <div class="log"><b>18:10</b><span>臨時枠</span><span>臨時枠を追加しました</span><span class="ok">正常</span></div>
      <div class="log"><b>17:56</b><span>接種増減枠</span><span>接種増減枠を設定しました</span><span class="ok">正常</span></div>
      <div class="log"><b>17:43</b><span>設定変更</span><span>基本設定を更新しました</span><span class="ok">正常</span></div>
      <div class="log"><b>17:28</b><span>システム</span><span>定期チェックが完了しました</span><span class="ok">正常</span></div>
    </div>
  </div>

  <div class="settings-area">
    <details class="card setting-card">
      <summary><div><h3>設定カード（基本設定）</h3><span>基本設定を確認・変更</span></div><span class="chev">⌄</span></summary>
      <div class="setting-body">基本設定の編集エリア</div>
    </details>

    <div class="settings-row">
      <details class="card setting-card">
        <summary><div><h3>休診日</h3><span>休診日の確認・変更</span></div><span class="chev">⌄</span></summary>
        <div class="setting-body">休診日の編集エリア</div>
      </details>
      <details class="card setting-card">
        <summary><div><h3>臨時休診日</h3><span>臨時休診日の確認・変更</span></div><span class="chev">⌄</span></summary>
        <div class="setting-body">臨時休診日の編集エリア</div>
      </details>
    </div>

    <div class="settings-row">
      <details class="card setting-card">
        <summary><div><h3>臨時枠</h3><span>臨時枠の確認・変更</span></div><span class="chev">⌄</span></summary>
        <div class="setting-body">臨時枠の編集エリア</div>
      </details>
      <details class="card setting-card">
        <summary><div><h3>接種増減枠</h3><span>接種増減枠の確認・変更</span></div><span class="chev">⌄</span></summary>
        <div class="setting-body">接種増減枠の編集エリア</div>
      </details>
    </div>
  </div>
</section>'''

          pattern = re.compile(r'<section id="status" class="tabpage hidden">.*?</section>\n</div>\n<script>', re.S)
          new_text, count = pattern.subn(status + '\n</div>\n<script>', text, count=1)
          if count != 1:
              raise SystemExit(f'status section replacement count={count}')

          path.write_text(new_text)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.html
          git diff --cached --quiet && exit 0
          git commit -m 'ステータス設定モックの見た目を更新'
          git push
