name: temp-status-mobile-containment
on:
  push:
    paths:
      - '.github/workflows/temp-status-mobile-containment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/temp_status_mobile_containment.py
      - name: Verify
        run: grep -q 'status-settings-mobile-containment-final' status-settings.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status-settings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ステータス設定モックをスマホ画面内に収める'
          git push
