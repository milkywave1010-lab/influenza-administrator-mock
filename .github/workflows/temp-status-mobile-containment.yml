name: temp-status-mobile-containment
on:
  push:
    paths:
      - '.github/workflows/temp-status-mobile-containment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/temp_status_mobile_containment.py
      - name: Verify
        run: |
          grep -q 'status-settings-mobile-containment-final' status-settings.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('status-settings.html').read_text(encoding='utf-8')
          assert s.find('status-settings-mobile-containment-final') < s.find('</head>')
          assert s.find('</html>') > s.find('status-settings-mobile-containment-final')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status-settings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ステータス設定モックの幅修正CSS配置を確定'
          git push
