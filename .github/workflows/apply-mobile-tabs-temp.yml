name: 管理画面モックのスマホ切替を反映
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-tabs-temp.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: スマホ切替を予約画面と同じ動きにする
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tabs.html')
          s=p.read_text()
          old='@media(max-width:900px){.page{padding:10px}.badge{display:none}.brand h1{font-size:18px}.tabs{gap:5px}.tab{font-size:12px;min-height:46px;padding:0 4px}.summary{grid-template-columns:1fr 1fr;gap:7px}.metric{padding:10px}.metric b{font-size:22px}.main{grid-template-columns:1fr}.panel-body{padding:11px}.navrow strong{font-size:15px}.right-tools{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail-col:first-child{border-right:0;padding-right:0}.detail-col:last-child{padding-left:0}.detail-actions{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr}.log{grid-template-columns:90px 90px 1fr}.log span:last-child{display:none}.reserve-actions{grid-template-columns:1fr}.month-day{min-height:78px}}'
          new='@media(max-width:900px){.page{padding:10px}.badge{display:none}.brand h1{font-size:18px}.tabs{grid-template-columns:1fr;--tab-collapse:0;row-gap:calc(10px * (1 - var(--tab-collapse)));position:sticky;top:0;z-index:20;padding:8px 0;background:var(--bg)}.tab{min-height:58px;max-height:58px;padding:9px 12px;font-size:17px;transition:min-height .05s linear,max-height .05s linear,opacity .05s linear,padding .05s linear,border-width .05s linear;overflow:hidden}.tab:not(.active){min-height:calc(58px * (1 - var(--tab-collapse)));max-height:calc(58px * (1 - var(--tab-collapse)));padding-top:calc(9px * (1 - var(--tab-collapse)));padding-bottom:calc(9px * (1 - var(--tab-collapse)));opacity:calc(1 - var(--tab-collapse));border-width:calc(1px * (1 - var(--tab-collapse)))}.tabs.is-stuck .tab:not(.active){pointer-events:none}.summary{grid-template-columns:1fr 1fr;gap:7px}.metric{padding:10px}.metric b{font-size:22px}.main{grid-template-columns:1fr}.panel-body{padding:11px}.navrow strong{font-size:15px}.right-tools{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail-col:first-child{border-right:0;padding-right:0}.detail-col:last-child{padding-left:0}.detail-actions{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr}.log{grid-template-columns:90px 90px 1fr}.log span:last-child{display:none}.reserve-actions{grid-template-columns:1fr}.month-day{min-height:78px}}'
          if old not in s:
            raise SystemExit('スマホCSS対象が見つかりません')
          s=s.replace(old,new,1)
          old2='renderAllCalendars();renderPatients();\n</script>'
          new2='''renderAllCalendars();renderPatients();
(function(){
  const tabs=document.querySelector('.tabs');
  if(!tabs)return;
  const sentinel=document.createElement('div');
  sentinel.setAttribute('aria-hidden','true');
  tabs.parentNode.insertBefore(sentinel,tabs);
  const collapseDistance=130;
  const syncTabs=function(){
    if(window.matchMedia('(max-width:900px)').matches){
      const start=sentinel.getBoundingClientRect().top+window.pageYOffset;
      const progress=Math.max(0,Math.min(1,(window.pageYOffset-start)/collapseDistance));
      tabs.style.setProperty('--tab-collapse',progress.toFixed(3));
      tabs.classList.toggle('is-stuck',progress>=0.999);
    }else{
      tabs.style.removeProperty('--tab-collapse');
      tabs.classList.remove('is-stuck');
    }
  };
  window.addEventListener('scroll',syncTabs,{passive:true});
  window.addEventListener('resize',syncTabs);
  syncTabs();
})();
</script>'''
          if old2 not in s:
            raise SystemExit('スマホ動作追加位置が見つかりません')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.html
          git diff --cached --quiet && exit 0
          git commit -m "スマホ切替を予約画面と同じ表示と動きに変更"
          git push
