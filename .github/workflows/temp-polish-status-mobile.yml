name: temp-polish-status-mobile
on:
  push:
    paths:
      - '.github/workflows/temp-polish-status-mobile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile polish
        run: python3 tools/temp_polish_status_mobile.py
      - name: Verify source
        run: |
          grep -q 'status-settings-mobile-polish-final' status-settings.html
          ! grep -q 'status-settings-mobile-fit-all-final' status-settings.html
          ! grep -q 'status-settings-mobile-containment-final' status-settings.html
      - name: Smoke render on phone widths
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'Chrome not available'; exit 1; fi
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=375,2400 --screenshot=phone-375.png "file://$PWD/status-settings.html"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=430,2400 --screenshot=phone-430.png "file://$PWD/status-settings.html"
          test -s phone-375.png
          test -s phone-430.png
      - uses: actions/upload-artifact@v4
        with:
          name: status-mobile-check
          path: |
            phone-375.png
            phone-430.png
      - name: Commit final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status-settings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '公開モックのステータス設定画面崩れを修正'
          git push
